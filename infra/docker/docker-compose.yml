services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sportsbook}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sportsbook}
      POSTGRES_DB: ${POSTGRES_DB:-sportsbook}
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-sportsbook}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../..
      dockerfile: apps/backend/Dockerfile
    ports:
      - '3000:3000'
    environment:
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-sportsbook}:${POSTGRES_PASSWORD:-sportsbook}@postgres:5432/${POSTGRES_DB:-sportsbook}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-dev-only-insecure-secret-change-me}
      STAFF_JWT_SECRET: ${STAFF_JWT_SECRET:-dev-only-insecure-staff-secret-change-me}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-dev-only-insecure-admin-key-change-me}
    volumes:
      - ../../apps/backend/src:/workspace/apps/backend/src
      - ../../apps/backend/prisma:/workspace/apps/backend/prisma
      - ../../packages/shared/src:/workspace/packages/shared/src
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  odds-engine:
    build:
      context: ../..
      dockerfile: apps/odds-engine/Dockerfile
    ports:
      - '4001:4001'
    environment:
      PORT: 4001
    env_file:
      - path: ../../apps/odds-engine/.env
        required: false
    volumes:
      - ../../apps/odds-engine/src:/workspace/apps/odds-engine/src
      - ../../packages/shared/src:/workspace/packages/shared/src

  frontend:
    build:
      context: ../..
      dockerfile: apps/frontend/Dockerfile
    ports:
      - '5173:5173'
    environment:
      ODDS_ENGINE_PROXY_TARGET: http://odds-engine:4001
      BACKEND_PROXY_TARGET: http://backend:3000
    volumes:
      - ../../apps/frontend/src:/workspace/apps/frontend/src
      - ../../packages/shared/src:/workspace/packages/shared/src
    depends_on:
      - backend
      - odds-engine

  backoffice:
    build:
      context: ../..
      dockerfile: apps/backoffice/Dockerfile
    ports:
      - '5174:5174'
    environment:
      BACKEND_PROXY_TARGET: http://backend:3000
    volumes:
      - ../../apps/backoffice/src:/workspace/apps/backoffice/src
    depends_on:
      - backend

volumes:
  postgres-data:
