# Reference reverse-proxy config for betsome.me: routes one domain to both
# backoffice apps by path prefix, plus their backend/odds-engine API calls.
#
#   betsome.me/backoffice        -> apps/backoffice        (staff, one brand)
#   betsome.me/backoffice/super  -> apps/master-backoffice  (owner, all brands)
#
# nginx's plain-prefix `location` blocks match on longest prefix regardless
# of declaration order (unlike e.g. Express-style routers, where the first
# match wins) - so /backoffice/super/ below is picked correctly for its own
# requests even though /backoffice/ is a prefix of it. It's still listed
# first purely for readability - "more specific first" reads naturally, it
# just isn't load-bearing here the way it would be in the small Node script
# used to verify the underlying dispatch logic below.
#
# Verified locally: the path-prefix dispatch + SPA-fallback logic itself
# (with a small Node server standing in for nginx, since Docker/nginx aren't
# available in the sandbox that wrote this) - see docs/PROJECT_BRIEF.md
# Section 10. This exact nginx config has NOT been run - treat it as a
# correct-by-construction starting point to smoke test for real before
# relying on it.
#
# Assumes each app was built with the matching VITE_BASE_PATH (see
# apps/backoffice/vite.config.ts and apps/master-backoffice/vite.config.ts)
# so its own asset URLs already carry the right prefix, and nginx's `root`
# directive appends the full request URI - so the two dist/ outputs need to
# land at:
#   /var/www/betsome-me/backoffice/index.html + assets/       (apps/backoffice)
#   /var/www/betsome-me/backoffice/super/index.html + assets/ (apps/master-backoffice)
# i.e. apps/backoffice's dist/ contents go straight into .../backoffice/,
# and apps/master-backoffice's dist/ contents go into .../backoffice/super/
# (nested inside the same tree, not a sibling directory).
# Adjust `root`, `proxy_pass` targets, and TLS/listen directives for your
# actual hosting - this is a reference, not a drop-in prod config.

server {
    listen 80;
    server_name betsome.me;

    # Master backoffice (owner-only, all brands) - longest prefix first.
    location /backoffice/super/ {
        root /var/www/betsome-me;
        try_files $uri $uri/ /backoffice/super/index.html;
    }

    # Staff backoffice (one brand).
    location /backoffice/ {
        root /var/www/betsome-me;
        try_files $uri $uri/ /backoffice/index.html;
    }

    # Shared backend API - both apps proxy /backend/* the same way apps/*'s
    # own Vite dev-server proxy already does (see BACKEND_PROXY_TARGET).
    location /backend/ {
        proxy_pass http://backend:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # apps/backoffice also calls the odds-engine directly (see
    # ODDS_ENGINE_PROXY_TARGET) - master-backoffice doesn't use this.
    location /api/ {
        proxy_pass http://odds-engine:4001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        return 404;
    }
}
