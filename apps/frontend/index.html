<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0f1a" />
    <title>Sportsbook</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Saira+Condensed:ital,wght@0,600;0,700;1,700;1,800;1,900&family=Archivo:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!--
      Paints before index.css (loaded via main.tsx) or React itself has run
      - kills the blank-white flash between the browser parsing this file
      and the app actually mounting. The spinner markup lives inside #root
      so React's own render() call replaces it automatically once the real
      app is ready; nothing here needs to be torn down by hand. Brand
      colors aren't known this early (useBrandTheme only fetches them post-
      mount), so this intentionally stays neutral rather than guessing one.
    -->
    <style>
      html,
      body {
        margin: 0;
        background: #0b0d11;
      }
      #app-boot-loader {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #app-boot-loader div {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        border: 3px solid rgba(255, 255, 255, 0.15);
        border-top-color: rgba(255, 255, 255, 0.75);
        animation: app-boot-spin 0.8s linear infinite;
      }
      @keyframes app-boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="app-boot-loader" role="status" aria-label="Loading">
        <div></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
