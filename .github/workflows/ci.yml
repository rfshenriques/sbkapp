name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sportsbook
          POSTGRES_PASSWORD: sportsbook
          POSTGRES_DB: sportsbook
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U sportsbook"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgres://sportsbook:sportsbook@localhost:5432/sportsbook
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @sportsbook/backend prisma:generate

      - name: Apply database migrations
        run: pnpm --filter @sportsbook/backend prisma:migrate:deploy

      - name: Build
        run: pnpm run build

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: Lint
        run: pnpm run lint

      - name: Format check
        run: pnpm run format:check

      - name: Validate Docker Compose config
        run: docker compose -f infra/docker/docker-compose.yml config --quiet
